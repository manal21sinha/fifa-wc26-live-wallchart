<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>FIFA World Cup 2026 — Live Wall Chart</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b1d2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #07131c; color: #cfe6f2;
    font-size: 14px; border-bottom: 1px solid #16303f;
  }
  #bar strong { color: #fff; }
  #status { margin-left: auto; opacity: .9; white-space: nowrap; }
  #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ad07a; margin-right:6px; vertical-align: middle; }
  #status.stale .dot { background:#e0a93a; }
  #status.err .dot { background:#e0533a; }
  a.editlink { color:#6fd0ee; text-decoration:none; }

  #wrap { width: 100%; margin: 0 auto; }
  #chart { position: relative; width: 100%; container-type: size; }
  #chart img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

  /* Kiosk "fit to screen" mode (enabled with ?fit) — the whole chart fits the
     visible area with no scrolling, centred. Sized by JS (fitToViewport) so it
     respects BOTH the available width and height, whichever is tighter. */
  body.fit { overflow: hidden; }
  body.fit #wrap {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  body.fit #chart { width: auto; }      /* explicit px width set in JS */
  body.fit #hint { display: none; }     /* hide the hint on a TV; keep credit */
  body.fit #credit { text-align: center; padding: 4px 14px 2px; }
  body.fit #built-by { display: none; } /* hide Claude attribution on a TV */

  .fld {
    position: absolute; display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap; line-height: 1;
    font-weight: 700; color: #111;
  }
  .fld.name { color: #0b1d2a; }
  /* Penalty-shootout count, e.g. the "(4)" in 3(4): compact raised superscript
     so the regular score stays the dominant, full-size figure. */
  .fld .pen {
    font-size: 0.62em; font-weight: 700; vertical-align: super;
    line-height: 0; margin-left: 0.04em; opacity: 0.9;
  }

  /* ── Kaleidoscope fill for empty boxes ─────────────────────────────────
     Each empty field animates a multi-stop gradient while slowly rotating
     its hue. Per-box CSS vars (set in JS) randomise colours, angle, speed
     and phase so the chart shimmers with every box on its own rhythm.   */
  @keyframes kaleido {
    0%   { background-position:   0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position:   0% 50%; }
  }
  @keyframes kaleidoHue {
    from { filter: hue-rotate(0deg) saturate(1.05); }
    to   { filter: hue-rotate(360deg) saturate(1.05); }
  }
  .fld.empty {
    background-image: linear-gradient(
        var(--angle, 120deg),
        hsl(var(--h1, 200), 85%, 62%),
        hsl(var(--h2, 320), 85%, 62%),
        hsl(var(--h3, 50), 85%, 62%),
        hsl(var(--h1, 200), 85%, 62%));
    background-size: 320% 320%;
    border-radius: 3px;
    opacity: 0.9;
    animation:
      kaleido    var(--dur, 9s)  ease-in-out infinite,
      kaleidoHue var(--hue, 14s) linear      infinite;
    animation-delay: var(--delay, 0s);
    transition: opacity .6s ease;
  }
  /* When a value lands, the box leaves .empty: gradient fades, text shows. */
  .fld:not(.empty) { background-image: none; opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .fld.empty { animation: none; }   /* keep the colourful gradient, no motion */
  }

  /* ── Live game-clock pill ──────────────────────────────────────────────
     A clock field is a transparent slot (sized in fields.json) that holds a
     dark rounded "pill" with white condensed text and a pulsing red live dot.
     The pill is centred in the slot, leaving a sliver of card background on all
     sides (the slot is the validated watertight zone). */
  .fld.clock { background: none; overflow: visible; }
  .clockpill {
    display: inline-flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 0.10em;
    background: #12171c; border-radius: 6px;
    padding: 0.18em 0.34em; line-height: 1;
    font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue Condensed",
                 sans-serif-condensed, sans-serif;
    font-stretch: condensed; font-weight: 700; color: #fff;
    letter-spacing: -0.01em; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .clockpill .cdot {
    width: 0.42em; height: 0.42em; border-radius: 50%;
    background: #f54550; flex: none;
    animation: clockpulse 1.4s ease-in-out infinite;
  }
  .clockpill .cline { display: block; }
  @keyframes clockpulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .clockpill .cdot { animation: none; }
  }

  #hint { color:#9fc2d4; font-size:13px; padding:10px 14px; }
  #credit { color:#7fa6bb; font-size:12px; padding:0 14px 6px; margin:0; }
  #credit a { color:#6fd0ee; }
  #built-by { color:#5a7a8a; font-size:11px; padding:0 14px 14px; margin:0; font-style:italic; }
  #built-by a { color:#4da8c8; }
  code { background:#13303f; padding:1px 5px; border-radius:4px; }

  /* Red-card corner badge: a small vertical stack of red squares overlaid on a
     corner of a team name (group printed names + knockout name fields). Built
     in applyValues from the count of 🟥 in that team's Scorers cell. The .fld
     slot is transparent; the badge floats just outside the chosen corner. */
  .fld.cards { background: none; overflow: visible; }
  /* A name field showing a red-card badge must let the badge spill outside. */
  .fld.name.has-cards { overflow: visible; }
  .cardbadge {
    position: absolute; display: flex; flex-direction: column;
    gap: 0.18em; pointer-events: none;
  }
  .cardbadge .rcard {
    width: 0.85em; height: 1.15em; border-radius: 0.16em;
    background: #e2241a; box-shadow: 0 0 0 0.07em rgba(0,0,0,.35);
  }

  /* Score box with scorers: hint that it's interactive. */
  .fld.score[data-tip]{ cursor: help; }
  .fld.score[data-tip]:focus-visible{ outline: 2px solid #2b8fc4; outline-offset: 1px; }

  /* Possession hover zone (over the VS circle). Transparent but focusable. */
  .fld.possession { background: none; cursor: pointer; border-radius: 50%; }
  .fld.possession[data-poss]{ cursor: help; }
  .fld.possession[data-poss]:focus-visible{ outline: 2px solid #2b8fc4; outline-offset: 2px; border-radius: 50%; }

  /* Group label hover zone (over the vertical GROUP X text). Transparent;
     pointer-events controlled by JS (inert until all 4 teams are filled in). */
  .fld.group_label { background: none; pointer-events: none; border-radius: 3px; }
  .fld.group_label.active { pointer-events: auto; cursor: pointer; }
  .fld.group_label.active:focus-visible { outline: 2px solid #2b8fc4; outline-offset: 2px; }

  /* Group standings table inside the shared #tip popover. */
  .grptable {
    border-collapse: collapse; width: 100%;
    font-size: 1.35cqh; line-height: 1.25;
  }
  .grptable caption {
    text-align: left; font-size: 1.5cqh; font-weight: 700;
    letter-spacing: .05em; padding-bottom: .5cqh;
    color: #eaf4fa;
  }
  .grptable th {
    font-size: 1.0cqh; font-weight: 600; letter-spacing: .05em;
    opacity: .6; padding: .25cqh .5cqw; border-bottom: 0.1cqh solid #2b6b8c;
    text-align: right; white-space: nowrap;
  }
  .grptable th.team-col { text-align: left; }
  .grptable td {
    padding: .3cqh .5cqw; text-align: right; white-space: nowrap;
    border-bottom: 0.07cqh solid rgba(255,255,255,.07);
  }
  .grptable td.team-col { text-align: left; padding-left: .3cqw; }
  .grptable td.pts { font-weight: 700; color: #eaf4fa; }
  .grptable tr:last-child td { border-bottom: none; }

  /* Possession bar inside the popover. */
  .possbar {
    display: flex; height: 2.2cqh; border-radius: 0.5cqh; overflow: hidden;
    margin-top: 0.6cqh; min-width: 18cqw;
  }
  .possbar .home { background: #0D2032; }
  .possbar .away { background: #FF5049; }
  .possbar .pct {
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2cqh; font-weight: 700; color: #fff; padding: 0 0.4cqh;
    white-space: nowrap;
  }

  /* Scorer popover — lives INSIDE #chart so it scales with the chart under
     both Mac page-zoom AND iOS pinch-zoom (a position:fixed element would stay
     screen-sized under iOS visual-viewport zoom and look oversized). Sized in
     container-query units so its text tracks the chart's on-screen size. */
  #tip {
    position: absolute; z-index: 100; max-width: 34cqw;
    background: #07131c; color: #eaf4fa; border: 0.12cqh solid #2b6b8c;
    border-radius: 1cqh; padding: 0.7cqh 1cqh;
    font-size: 1.5cqh; line-height: 1.3;
    box-shadow: 0 0.4cqh 1.4cqh rgba(0,0,0,.35);
    pointer-events: none; opacity: 0; transform: translateY(0.4cqh);
    transition: opacity .12s ease, transform .12s ease;
    white-space: normal;
  }
  #tip.show { opacity: 1; transform: translateY(0); }
  /* When pinned (sticky), allow pointer events so the report link is clickable. */
  #tip.pinned { pointer-events: auto; }
</style>
</head>
<body>
  <div id="bar">
    <strong>World Cup 2026</strong> <span>Live Wall Chart</span>
    <span id="status"><span class="dot"></span><span id="statusText">loading…</span></span>
  </div>

  <div id="wrap"><div id="chart"><img id="bg" alt="World Cup 2026 wall chart" /><div id="tip" role="tooltip" aria-hidden="true"></div></div></div>
  <p id="hint"></p>
  <p id="credit">Original wall chart artwork from the <a href="https://downloads.bbc.co.uk/england/pdf/BBC_WC_26_WALL_CHART.pdf">BBC</a>.</p>
  <p id="built-by">Designed and built with <a href="https://www.anthropic.com/claude">Claude Opus 4.8</a>, with a little help from <a href="https://www.anthropic.com/claude">Sonnet 4.6</a>.</p>

<script src="config.js"></script>
<script>
const CFG = window.CHART_CONFIG;
const FIELDS_URL = "fields.json";
const chart = document.getElementById("chart");
const bg = document.getElementById("bg");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const hint = document.getElementById("hint");
bg.src = "chart.jpg";

const nodes = {};   // field id -> span element
let canvasAR = 1;   // chart aspect ratio (width/height), set in buildOverlay
const FIT = new URLSearchParams(location.search).has("fit");  // kiosk mode

function setStatus(state, text){ statusEl.className = state; statusText.textContent = text; }

// Build the gviz JSON endpoint — public, no API key, cache-buster friendly.
// We use JSON (not CSV) on purpose: gviz infers ONE type per column, so a
// Value column full of digits gets typed numeric and TEXT cells (team names)
// come back blank in CSV. JSON returns every cell's value (and a formatted
// string 'f') regardless of column type, so names and scores both arrive.
function sheetUrl(){
  const base = `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq`;
  const q = new URLSearchParams({ tqx: "out:json", sheet: CFG.SHEET_NAME,
                                  headers: "1", t: Date.now() });
  return `${base}?${q.toString()}`;
}

// gviz wraps JSON in a JS call:  /*O_o*/ google.visualization.Query.setResponse({...});
// Strip the wrapper and parse the payload.
function parseGviz(text){
  const a = text.indexOf("{");
  const b = text.lastIndexOf("}");
  if (a === -1 || b === -1) throw new Error("unexpected gviz response");
  return JSON.parse(text.slice(a, b + 1));
}

// Turn the gviz table into { values: {fieldId: value}, scorers: {fieldId: text} }.
// Columns are matched by header label. Cell value prefers raw 'v', falls back
// to formatted 'f'; everything coerced to a trimmed string.
function tableToData(payload){
  const table = payload.table || {};
  const cols = table.cols || [];
  const rows = table.rows || [];
  const labelIdx = (name) => cols.findIndex(c => (c.label || "").trim() === name);
  let idIdx = labelIdx(CFG.ID_COLUMN);
  let valIdx = labelIdx(CFG.VALUE_COLUMN);
  let scIdx = labelIdx(CFG.SCORERS_COLUMN);
  let clkIdx = labelIdx(CFG.CLOCK_COLUMN);
  let xgIdx = labelIdx(CFG.XG_COLUMN);
  let posIdx = labelIdx(CFG.POSSESSION_COLUMN);
  let repIdx = labelIdx(CFG.REPORT_COLUMN);
  // Fallback column order: Desc,Field ID,Value,Scorers,Clock,Phase,Anchor,xG,Poss,Report.
  if (idIdx === -1) idIdx = 1;
  if (valIdx === -1) valIdx = 2;
  if (scIdx === -1) scIdx = 3;
  if (clkIdx === -1) clkIdx = 4;
  if (xgIdx === -1) xgIdx = 7;
  if (posIdx === -1) posIdx = 8;
  if (repIdx === -1) repIdx = 9;
  const cellStr = (cell) => {
    if (!cell) return "";
    const v = (cell.v !== null && cell.v !== undefined) ? cell.v : cell.f;
    return (v === null || v === undefined) ? "" : String(v).trim();
  };
  const values = {}, scorers = {}, clocks = {}, xg = {}, possession = {}, reports = {};
  for (const row of rows){
    const c = row.c || [];
    const id = cellStr(c[idIdx]);
    if (!id) continue;
    values[id] = cellStr(c[valIdx]);
    const sc = cellStr(c[scIdx]);
    if (sc) scorers[id] = sc;
    const ck = cellStr(c[clkIdx]);
    if (ck) clocks[id] = ck;
    const xv = cellStr(c[xgIdx]);
    if (xv) xg[id] = xv;
    const pv = cellStr(c[posIdx]);
    if (pv) possession[id] = pv;
    const rv = cellStr(c[repIdx]);
    if (rv) reports[id] = rv;
  }
  return { values, scorers, clocks, xg, possession, reports };
}

async function buildOverlay(){
  const m = await (await fetch(FIELDS_URL, {cache:"no-store"})).json();
  chart.style.aspectRatio = `${m.canvas.width} / ${m.canvas.height}`;
  canvasAR = m.canvas.width / m.canvas.height;   // for fit-to-screen mode
  const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
  for (const f of m.fields){
    const el = document.createElement("div");
    el.style.left = f.left + "%"; el.style.top = f.top + "%";
    el.style.width = f.width + "%"; el.style.height = f.height + "%";
    el._kind = f.kind;
    el._id = f.id;

    if (f.kind === "clock"){
      // Clock slot: a transparent container that holds a pill (built on demand
      // in applyValues). No kaleidoscope, no inner text span, never "empty".
      el.className = "fld clock";
      // font-size drives the pill's em-based sizing; scale to the slot.
      el.style.fontSize = `min(${f.height * 0.92}cqh, ${f.width * 0.30}cqw)`;
      nodes[f.id] = el;
      chart.appendChild(el);
      continue;
    }

    if (f.kind === "cards"){
      // Red-card anchor: a transparent box over a team name; a corner badge of
      // small red squares is built in applyValues. No kaleidoscope/text.
      el.className = "fld cards";
      el.dataset.corner = f.corner || "right";   // outer corner for the badge
      // square size scales with the chart height; small, ~clock-pill scale.
      el.style.fontSize = `min(${f.height * 0.30}cqh, 0.85cqw)`;
      nodes[f.id] = el;
      chart.appendChild(el);
      continue;
    }

    if (f.kind === "possession"){
      // Possession hover zone over the match's VS circle. Transparent and
      // focusable; on hover/focus it shows the possession-bar popover (built in
      // applyValues from this match's possession value). No kaleidoscope/text.
      el.className = "fld possession";
      nodes[f.id] = el;
      chart.appendChild(el);
      continue;
    }

    if (f.kind === "group_label"){
      // Group-label hover zone over the vertical "GROUP X" text. Starts inert
      // (pointer-events:none via CSS); activateGroupZones() adds .active once
      // all 4 team names for the group are present in the Groups sheet.
      el.className = "fld group_label";
      el.dataset.group = f.group;
      el.setAttribute("tabindex", "-1"); // promoted to 0 when active
      nodes[f.id] = el;
      chart.appendChild(el);
      continue;
    }

    el.className = "fld " + f.kind + " empty";   // start empty -> kaleidoscope
    const fs = (f.kind === "name") ? f.height * 0.62 : f.height * 0.72;
    const baseFs = `min(${fs}cqh, ${f.width * 0.9}cqw)`;
    el.dataset.basefs = baseFs;     // remembered so we can reset before refitting
    el.style.fontSize = baseFs;
    // Text lives in an inner span so we can measure its true width reliably
    // (a flex-centred container's scrollWidth is unreliable when text overflows
    // both sides). The span is what we fit; the box stays put.
    const span = document.createElement("span");
    // Always start nowrap; applyValues sets pre-wrap dynamically only when the
    // value actually contains an explicit \n (Alt+Enter in Sheets). This way,
    // names like "SOUTH AFRICA" stay on one line and shrink via fitText, while
    // "BOSNIA &\nHERZEGOVINA" wraps exactly at the user-inserted line break.
    span.style.whiteSpace = "nowrap";
    el.appendChild(span);
    el._txt = span;
    // Name fields remember their box dimensions so applyValues can recompute
    // the base font size by line count — a two-line name needs half the per-line
    // height so the block still fits inside the box vertically.
    if (f.kind === "name"){ el._fh = f.height; el._fw = f.width; }
    // Per-box random kaleidoscope: 3 spread hues, random angle/speed/phase.
    const base = rnd(0, 360);
    el.style.setProperty("--h1", base.toFixed(0));
    el.style.setProperty("--h2", ((base + rnd(80, 160)) % 360).toFixed(0));
    el.style.setProperty("--h3", ((base + rnd(180, 300)) % 360).toFixed(0));
    el.style.setProperty("--angle", rnd(0, 360).toFixed(0) + "deg");
    el.style.setProperty("--dur",  rnd(6, 13).toFixed(1) + "s");
    el.style.setProperty("--hue",  rnd(10, 22).toFixed(1) + "s");
    el.style.setProperty("--delay", (-rnd(0, 13)).toFixed(1) + "s"); // desync
    nodes[f.id] = el;
    chart.appendChild(el);
  }
}

// Shrink a field's text to fit its box when the natural (box-based) size is
// too wide — e.g. "SWITZERLAND" in a narrow name box. Reset to the base size
// first, then scale down by the overflow ratio (never up). Measures the inner
// span against the box's inner width.
function fitText(el){
  if (el.classList.contains("empty") || !el._txt || !el._txt.textContent) return;
  el.style.fontSize = el.dataset.basefs || el.style.fontSize;
  const avail = el.clientWidth * 0.92;     // leave a little side padding
  const need = el._txt.scrollWidth;
  if (need > avail && need > 0){
    const px = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(1, Math.floor(px * avail / need)) + "px";
  }
}

// Render a score string into the box's inner span. A plain value (score or
// team name) is set as text. A penalty-shootout score like "3(4)" is split so
// the regular score stays full-size and the shootout count "(4)" renders as a
// compact superscript. Matching is strict (digits + parenthesised digits) so
// ordinary text never gets reinterpreted.
const PEN_RE = /^(\d+)\((\d+)\)$/;
function renderScore(span, v){
  const m = PEN_RE.exec(v);
  if (m){
    span.textContent = "";                 // clear safely (no innerHTML w/ data)
    span.appendChild(document.createTextNode(m[1]));
    const sup = document.createElement("sup");
    sup.className = "pen";
    sup.textContent = "(" + m[2] + ")";
    span.appendChild(sup);
  } else {
    span.textContent = v;
  }
}

// Render a live-clock value into a clock slot as a dark pill with a pulsing
// red dot. Hidden when blank. The dot is dropped for terminal states (FT/AET).
// The extra-time break token "ET/HT" renders as a 3-row pill (dot / ET / HT);
// everything else is the standard 2-row pill (dot above one text line).
const NO_DOT = new Set(["FT", "AET"]);
function renderClock(el, raw){
  const v = (raw ?? "").toString().trim();
  el.textContent = "";
  if (!v) return;                              // blank -> no pill
  const pill = document.createElement("span");
  pill.className = "clockpill";
  const showDot = !NO_DOT.has(v.toUpperCase());
  if (showDot){
    const dot = document.createElement("span");
    dot.className = "cdot";
    pill.appendChild(dot);
  }
  // lines: "ET/HT" -> ["ET","HT"]; otherwise a single line.
  const lines = (v.toUpperCase() === "ET/HT") ? ["ET", "HT"] : [v];
  for (const ln of lines){
    const s = document.createElement("span");
    s.className = "cline";
    s.textContent = ln;
    pill.appendChild(s);
  }
  el.appendChild(pill);
}

// Count red-card emojis in a Scorers string.
function countRedCards(s){
  if (!s) return 0;
  // Match the red-square emoji (U+1F7E5). Use a global regex on the raw text.
  const m = s.match(/\u{1F7E5}/gu);
  return m ? m.length : 0;
}

// The Scorers cell that holds a given team's cards/goals:
//   group NN home/away -> groupNN_(home|away)_score
//   knockout top/bottom -> koNN_(top|bottom)_score
function scorerKeyForTeam(fieldId){
  // group card anchor: group01_home_cards -> group01_home_score
  let m = fieldId.match(/^(group\d{2})_(home|away)_cards$/);
  if (m) return `${m[1]}_${m[2]}_score`;
  // knockout name field: ko20_top_team -> ko20_top_score
  m = fieldId.match(/^(ko\d{2})_(top|bottom)_team$/);
  if (m) return `${m[1]}_${m[2]}_score`;
  return null;
}

// Render (or clear) a red-card corner badge of `n` small squares (cap 3) on a
// slot, anchored to its outer corner.
function renderCards(el, n){
  el.textContent = "";
  if (n <= 0) return;
  const badge = document.createElement("span");
  badge.className = "cardbadge";
  // anchor to the chosen corner, just outside the box, vertically centred-ish
  const corner = el.dataset.corner || "right";
  badge.style.top = "0";
  if (corner === "left"){ badge.style.right = "100%"; badge.style.marginRight = "0.2em"; }
  else { badge.style.left = "100%"; badge.style.marginLeft = "0.2em"; }
  for (let i = 0; i < Math.min(n, 3); i++){
    const sq = document.createElement("span");
    sq.className = "rcard";
    badge.appendChild(sq);
  }
  el.appendChild(badge);
}

function applyValues(data){
  const values = data.values || {};
  const scorers = data.scorers || {};
  const clocks = data.clocks || {};
  const xg = data.xg || {};
  const possession = data.possession || {};
  const reports = data.reports || {};
  for (const id in nodes){
    const el = nodes[id];
    if (el._kind === "clock"){ renderClock(el, clocks[id]); continue; }
    if (el._kind === "cards"){                       // group printed-name badge
      const k = scorerKeyForTeam(id);
      renderCards(el, countRedCards(k ? scorers[k] : ""));
      continue;
    }
    if (el._kind === "possession"){ setPossession(el, possession, xg, reports); continue; }
    const v = (values[id] ?? "").toString();
    // Score boxes may carry a penalty superscript; name boxes use pre-wrap so
    // explicit newlines (Alt+Enter in Sheets) are honoured. For multi-line names,
    // recompute basefs by line count so the whole block fits vertically: each
    // line gets (box height / n lines) worth of cap-height, just like a single
    // line would get the full height.
    if (el._kind === "score") renderScore(el._txt, v);
    else {
      el._txt.textContent = v;
      if (el._kind === "name" && el._fh !== undefined){
        const hasNewline = v.includes("\n");
        const lines = hasNewline ? v.split("\n").length : 1;
        // Only allow wrapping when the user explicitly inserted a \n; otherwise
        // keep nowrap so fitText can shrink the whole name onto one line.
        el._txt.style.whiteSpace = hasNewline ? "pre-wrap" : "nowrap";
        const perLine = el._fh / Math.max(lines, 1);
        const fs = perLine * 0.62;
        const newBase = `min(${fs}cqh, ${el._fw * 0.9}cqw)`;
        el.dataset.basefs = newBase;
        el.style.fontSize = newBase;
      }
    }
    // Empty -> shimmering kaleidoscope; filled -> clean value, no animation.
    el.classList.toggle("empty", v === "");
    // Scorer tooltip (xG has moved to the VS-circle possession tooltip).
    if (el._kind === "score"){
      const sc = (v !== "" && scorers[id]) ? scorers[id] : "";
      setTooltip(el, sc);
    }
    // Knockout NAME fields carry their own red-card corner badge (groups use
    // the separate "cards" anchors above). Build it from the name's score row.
    if (el._kind === "name"){
      let badge = el.querySelector(":scope > .cardbadge");
      if (badge) badge.remove();
      const k = scorerKeyForTeam(id);
      const n = countRedCards(k ? scorers[k] : "");
      if (n > 0 && v !== ""){      // only show on a known (filled) team
        if (!el.dataset.corner){
          // knockout: outer corner = away from the score box. Left-bracket
          // names have the score on their right, so the OUTER corner is LEFT;
          // right-bracket names have score on the left -> outer corner RIGHT.
          el.dataset.corner = (parseFloat(el.style.left) < 50) ? "left" : "right";
        }
        renderCardsInto(el, n);
        el.classList.add("has-cards");
      } else {
        el.classList.remove("has-cards");
      }
    }
  }
  // Refit after the DOM updates so measurements are accurate.
  requestAnimationFrame(() => { for (const id in nodes) fitText(nodes[id]); });
}

// Append a card badge to an element that ALSO holds text (knockout name box),
// without wiping its text content.
function renderCardsInto(el, n){
  const badge = document.createElement("span");
  badge.className = "cardbadge";
  const corner = el.dataset.corner || "right";
  badge.style.top = "0";
  if (corner === "left"){ badge.style.right = "100%"; badge.style.marginRight = "0.2em"; }
  else { badge.style.left = "100%"; badge.style.marginLeft = "0.2em"; }
  // size the squares relative to the name box height; small, ~clock-pill scale.
  badge.style.fontSize = "min(30cqh, 0.85cqw)";
  for (let i = 0; i < Math.min(n, 3); i++){
    const sq = document.createElement("span");
    sq.className = "rcard";
    badge.appendChild(sq);
  }
  el.appendChild(badge);
}

// Attach (or clear) the accessible score-box popover (scorers only now —
// xG has moved to the VS-circle possession tooltip for match-level context).
function setTooltip(el, text){
  const sc = (text || "").trim();
  if (sc){
    el.dataset.tip = sc;
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-label", (el._txt.textContent || "") + " — scorers: " + sc);
  } else {
    delete el.dataset.tip;
    el.removeAttribute("tabindex");
    el.removeAttribute("aria-label");
  }
}

// Possession (+ xG): read the match's possession and both teams' xG values;
// store on the zone for the VS-circle popover.
// Possession is entered on the home/top score row; xG on both score rows.
// Match Report URL is stored on the *_clock row for that match.
// The tooltip shows if at least one of possession, xG, or report is present.
function setPossession(el, possession, xg, reports){
  const m = el._id.match(/^(group\d{2}|ko\d{2})_poss$/);
  if (!m){ delete el.dataset.poss; delete el.dataset.xg; el.removeAttribute("tabindex"); return; }
  const base = m[1];
  const isGroup = base.startsWith("group");
  const homeKey = isGroup ? `${base}_home_score` : `${base}_top_score`;
  const awayKey = isGroup ? `${base}_away_score` : `${base}_bottom_score`;
  const possRaw  = (possession[homeKey] || "").toString().trim();
  const homeXg   = (xg[homeKey] || "").toString().trim();
  const awayXg   = (xg[awayKey] || "").toString().trim();
  // Report URL lives on the *_clock row (same base, different suffix)
  const clockKey = `${base}_clock`;
  const reportUrl = (reports[clockKey] || "").toString().trim();
  const hasPoss  = possRaw !== "" && !isNaN(parseFloat(possRaw));
  const hasXg    = homeXg !== "" || awayXg !== "";
  const hasReport = reportUrl !== "";
  if (!hasPoss && !hasXg && !hasReport){
    delete el.dataset.poss; delete el.dataset.xg; delete el.dataset.report;
    el.removeAttribute("tabindex"); el.removeAttribute("aria-label"); return;
  }
  if (hasPoss){
    const home = Math.round(parseFloat(possRaw));
    el.dataset.poss = `${home}|${100 - home}`;
  } else { delete el.dataset.poss; }
  if (hasXg){
    el.dataset.xg = `${homeXg}|${awayXg}`;
  } else { delete el.dataset.xg; }
  if (hasReport){
    el.dataset.report = reportUrl;
  } else { delete el.dataset.report; }
  el.setAttribute("tabindex", "0");
  const parts = [];
  if (hasPoss) parts.push(`possession ${Math.round(parseFloat(possRaw))}% vs ${100 - Math.round(parseFloat(possRaw))}%`);
  if (hasXg)  parts.push(`xG ${homeXg || "?"} vs ${awayXg || "?"}`);
  if (hasReport) parts.push("match report available");
  el.setAttribute("aria-label", "Match stats: " + parts.join(", "));
}

// ── Groups sheet: second gviz fetch (same SHEET_ID, different tab) ──────────

function groupsUrl(){
  const base = `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq`;
  const q = new URLSearchParams({ tqx: "out:json", sheet: CFG.GROUPS_SHEET_NAME,
                                  headers: "1", t: Date.now() });
  return `${base}?${q.toString()}`;
}

// Parse the Groups gviz payload into a map:
//   { "A": [{pos,team,pl,w,d,l,gd,pts}, …], "B": […], … }
// Column order matches groups_template.csv: Group,Pos,Team,PL,W,D,L,GD,PTS.
function parseGroupsSheet(payload){
  const table = payload.table || {};
  const cols  = table.cols  || [];
  const rows  = table.rows  || [];
  const idx   = (name) => cols.findIndex(c => (c.label||"").trim().toLowerCase() === name.toLowerCase());
  const iGrp = idx("Group"), iPos = idx("Pos"),  iTeam = idx("Team");
  const iPL  = idx("PL"),    iW   = idx("W"),    iD    = idx("D");
  const iL   = idx("L"),     iGD  = idx("GD"),   iPTS  = idx("PTS");
  const cell  = (r, i) => { if (i < 0 || !r.c || !r.c[i]) return ""; const cv = r.c[i]; const v = (cv.v !== null && cv.v !== undefined) ? cv.v : cv.f; return (v === null || v === undefined) ? "" : String(v).trim(); };
  const result = {};
  for (const row of rows){
    const grp = cell(row, iGrp);
    if (!grp) continue;
    if (!result[grp]) result[grp] = [];
    result[grp].push({
      pos:  cell(row, iPos),
      team: cell(row, iTeam),
      pl:   cell(row, iPL),
      w:    cell(row, iW),
      d:    cell(row, iD),
      l:    cell(row, iL),
      gd:   cell(row, iGD),
      pts:  cell(row, iPTS),
    });
  }
  return result;
}

// Store the latest groups data and activate/deactivate label zones.
// A zone becomes active when all 4 team names for that group are non-empty.
let groupsData = {};

function activateGroupZones(data){
  groupsData = data;
  for (const id in nodes){
    const el = nodes[id];
    if (el._kind !== "group_label") continue;
    const grp   = el.dataset.group;
    const rows  = (data[grp] || []);
    const allFilled = rows.length === 4 && rows.every(r => r.team.trim() !== "");
    if (allFilled){
      el.classList.add("active");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", `GROUP ${grp} standings — click to view`);
    } else {
      el.classList.remove("active");
      el.setAttribute("tabindex", "-1");
      el.removeAttribute("aria-label");
    }
  }
}

// Build the group standings table HTML inside the shared #tip popover.
function showGroupTable(grpEl){
  const grp  = grpEl.dataset.group;
  const rows = (groupsData[grp] || []).slice().sort((a, b) => parseInt(a.pos||9) - parseInt(b.pos||9));
  tipEl.textContent = "";

  const tbl = document.createElement("table");
  tbl.className = "grptable";

  // Caption: "GROUP A"
  const cap = document.createElement("caption");
  cap.textContent = `GROUP ${grp}`;
  tbl.appendChild(cap);

  // Header row
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  [["#",""], ["Team","team-col"], ["PL",""], ["W",""], ["D",""], ["L",""], ["GD",""], ["PTS",""]].forEach(([txt, cls]) => {
    const th = document.createElement("th");
    th.textContent = txt;
    if (cls) th.className = cls;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);

  // Data rows
  const tbody = document.createElement("tbody");
  for (const r of rows){
    const tr = document.createElement("tr");
    const cells = [
      [r.pos,  ""],
      [r.team, "team-col"],
      [r.pl,   ""],
      [r.w,    ""],
      [r.d,    ""],
      [r.l,    ""],
      [r.gd,   ""],
      [r.pts,  "pts"],
    ];
    for (const [val, cls] of cells){
      const td = document.createElement("td");
      td.textContent = val;
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  tipEl.appendChild(tbl);
  positionTip(grpEl);
}

async function refreshGroups(){
  if (!CFG.GROUPS_SHEET_NAME) return;
  try {
    const r = await fetch(groupsUrl(), {cache:"no-store"});
    if (!r.ok) return;   // silent — groups tab is optional
    activateGroupZones(parseGroupsSheet(parseGviz(await r.text())));
  } catch(e){
    console.warn("Groups sheet fetch failed:", e);
  }
}

async function refresh(){
  if (!CFG.SHEET_ID || CFG.SHEET_ID.startsWith("PASTE")){
    setStatus("err", "set SHEET_ID in config.js"); return;
  }
  try {
    const r = await fetch(sheetUrl(), {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = tableToData(parseGviz(await r.text()));
    applyValues(data);
    // Prefer the sheet's own "_updated" cell; fall back to this poll time.
    const stamp = (data.values["_updated"] || "").trim();
    setStatus("", "updated " + (stamp ? formatStamp(stamp)
                                      : new Date().toLocaleTimeString()));
  } catch(e){
    setStatus("err", "couldn't reach sheet — retrying");
    console.error(e);
  }
}

// Format the sheet's timestamp. Accepts an ISO string or any value Date can
// parse; if it isn't a recognisable date, show the raw text as-is.
function formatStamp(s){
  const d = new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleString();
}

// ── Shared popover — scorer/xG for score boxes; possession bar for VS zones.
// Lives INSIDE #chart (scales with zoom). Positioned in chart-relative %.
const tipEl = document.getElementById("tip");

function positionTip(box){
  tipEl.classList.add("show");
  tipEl.setAttribute("aria-hidden", "false");
  const c = chart.getBoundingClientRect();
  const b = box.getBoundingClientRect();
  const t = tipEl.getBoundingClientRect();
  if (!c.width || !c.height) return;
  const boxCx = (b.left + b.right) / 2 - c.left;
  const boxTop = b.top - c.top;
  const boxBot = b.bottom - c.top;
  let leftPx = boxCx - t.width / 2;
  leftPx = Math.max(4, Math.min(leftPx, c.width - t.width - 4));
  let topPx = boxTop - t.height - 6;
  if (topPx < 4) topPx = boxBot + 6;
  tipEl.style.left = (leftPx / c.width * 100) + "%";
  tipEl.style.top  = (topPx / c.height * 100) + "%";
}

function showTip(box){
  tipEl.textContent = "";                    // clear previous content

  if (box.dataset.poss !== undefined || box.dataset.xg !== undefined || box.dataset.report){
    // ── Possession bar ──────────────────────────────────────────────────
    if (box.dataset.poss !== undefined){
      const [homeRaw, awayRaw] = box.dataset.poss.split("|");
      const home = parseInt(homeRaw, 10) || 0;
      const away = parseInt(awayRaw, 10) || 0;
      const MIN = 7; const MAX = 93;
      const hp = Math.min(Math.max(home, MIN), MAX);
      const ap = 100 - hp;
      const lbl = document.createElement("div");
      lbl.textContent = "POSSESSION";
      lbl.style.cssText = "font-size:1.1cqh;font-weight:700;letter-spacing:.06em;opacity:.7;margin-bottom:.2cqh;";
      tipEl.appendChild(lbl);
      const bar = document.createElement("div");
      bar.className = "possbar";
      const homeSeg = document.createElement("div");
      homeSeg.className = "home pct"; homeSeg.style.flex = hp;
      homeSeg.textContent = `${home}%`;
      const awaySeg = document.createElement("div");
      awaySeg.className = "away pct"; awaySeg.style.flex = ap;
      awaySeg.textContent = `${away}%`;
      bar.appendChild(homeSeg); bar.appendChild(awaySeg);
      tipEl.appendChild(bar);
    }
    // ── xG row ──────────────────────────────────────────────────────────
    if (box.dataset.xg){
      const [hxg, axg] = box.dataset.xg.split("|");
      const xgLbl = document.createElement("div");
      xgLbl.textContent = "xG";
      xgLbl.style.cssText = "font-size:1.1cqh;font-weight:700;letter-spacing:.06em;opacity:.7;margin-top:.6cqh;margin-bottom:.2cqh;";
      tipEl.appendChild(xgLbl);
      const xgRow = document.createElement("div");
      xgRow.style.cssText = "display:flex;gap:.5cqw;font-size:1.4cqh;font-weight:700;";
      const hSpan = document.createElement("span");
      hSpan.style.cssText = "background:#0D2032;color:#fff;padding:.25cqh .7cqw;border-radius:.4cqh;";
      hSpan.textContent = hxg || "–";
      const aSpan = document.createElement("span");
      aSpan.style.cssText = "background:#FF5049;color:#fff;padding:.25cqh .7cqw;border-radius:.4cqh;";
      aSpan.textContent = axg || "–";
      xgRow.appendChild(hSpan); xgRow.appendChild(aSpan);
      tipEl.appendChild(xgRow);
    }
    // ── Match report link ────────────────────────────────────────────────
    if (box.dataset.report){
      const a = document.createElement("a");
      a.href = box.dataset.report;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "📋 Match report ↗";
      a.style.cssText = "display:block;margin-top:.7cqh;font-size:1.1cqh;color:#6fd0ee;text-decoration:none;opacity:.9;pointer-events:auto;";
      tipEl.appendChild(a);
    }
  } else {
    // ── Scorer lines (score-box tooltip) ───────────────────────────────
    const sc = box.dataset.tip || "";
    if (!sc) return;
    const s = document.createElement("div");
    s.textContent = sc;
    tipEl.appendChild(s);
  }
  positionTip(box);
}

function positionTip(box){
  // Make visible first so browser knows size, then place via rAF.
  tipEl.classList.add("show");
  tipEl.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => {
    const c = chart.getBoundingClientRect();
    const b = box.getBoundingClientRect();
    const t = tipEl.getBoundingClientRect();
    if (!c.width || !c.height) return;
    const boxCx = (b.left + b.right) / 2 - c.left;
    const boxTop = b.top - c.top;
    const boxBot = b.bottom - c.top;
    let leftPx = boxCx - t.width / 2;
    leftPx = Math.max(4, Math.min(leftPx, c.width - t.width - 4));
    let topPx = boxTop - t.height - 6;
    if (topPx < 4) topPx = boxBot + 6;
    tipEl.style.left = (leftPx / c.width * 100) + "%";
    tipEl.style.top  = (topPx / c.height * 100) + "%";
  });
}

function hideTip(){
  tipEl.classList.remove("show");
  tipEl.setAttribute("aria-hidden", "true");
}

function wireTooltips(){
  // ── Score-box tooltip: hover/focus only (not sticky) ─────────────────
  chart.addEventListener("mouseover", (e) => {
    const score = e.target.closest(".fld.score[data-tip]");
    if (score) showTip(score);
  });
  chart.addEventListener("focusin", (e) => {
    const score = e.target.closest(".fld.score[data-tip]");
    if (score) showTip(score);
    // Possession zone focused via keyboard: show (unpinned)
    const poss = e.target.closest(".fld.possession[data-poss],.fld.possession[data-xg],.fld.possession[data-report]");
    if (poss && !poss._pinned) showTip(poss);
  });

  // ── Possession zone hover: show (unpinned) ────────────────────────────
  chart.addEventListener("mouseover", (e) => {
    const poss = e.target.closest(".fld.possession[data-poss],.fld.possession[data-xg],.fld.possession[data-report]");
    if (poss && !poss._pinned) showTip(poss);
  });

  // Track mousedown on a possession zone so we can suppress the spurious
  // mouseout that the browser fires during a click (before click fires).
  // Without this, mouseout hides the tip before click can pin it.
  let clickingPoss = false;
  chart.addEventListener("mousedown", (e) => {
    clickingPoss = !!e.target.closest(".fld.possession[data-poss],.fld.possession[data-xg],.fld.possession[data-report]");
  });

  chart.addEventListener("mouseout", (e) => {
    const score = e.target.closest(".fld.score[data-tip]");
    if (score && !score.contains(e.relatedTarget)) hideTip();
    const poss = e.target.closest(".fld.possession[data-poss],.fld.possession[data-xg],.fld.possession[data-report]");
    if (poss){
      // Suppress hide if we're about to handle a click (mousedown was on this zone)
      // or if the tooltip is already pinned.
      if (!clickingPoss && !poss._pinned && !poss.contains(e.relatedTarget)) hideTip();
    }
    // Also hide if mousing out of the tip itself and not pinned
    if (e.target === tipEl || tipEl.contains(e.target)){
      if (!tipEl.classList.contains("pinned")) hideTip();
    }
  });
  document.addEventListener("mouseup", () => { clickingPoss = false; });

  chart.addEventListener("focusout", (e) => {
    // Keep visible if focus moves into the tip (e.g. clicking the report link)
    if (tipEl.contains(e.relatedTarget)) return;
    const poss = e.target.closest(".fld.possession");
    if (poss) poss._pinned = false;
    hideTip();
  });

  // ── Possession zone click: toggle sticky/pinned state ─────────────────
  // Scoped ONLY to possession zones — no other tooltips are affected.
  let pinnedEl = null;
  chart.addEventListener("click", (e) => {
    const poss = e.target.closest(".fld.possession[data-poss],.fld.possession[data-xg],.fld.possession[data-report]");
    if (!poss) return;
    e.stopPropagation(); // prevent the document click handler from immediately unpinning
    if (pinnedEl && pinnedEl !== poss){
      pinnedEl._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); hideTip();
    }
    if (poss._pinned){
      poss._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); hideTip();
    } else {
      poss._pinned = true; pinnedEl = poss; showTip(poss); tipEl.classList.add("pinned");
    }
  });

  // ── Group label click: show/pin the standings table ─────────────────────
  // Same pin model as possession zones: first click pins, same click/outside/
  // Escape unpins. Hover shows a preview (unpinned); click locks it in place.
  let clickingGrp = false;
  chart.addEventListener("mousedown", (e) => {
    if (e.target.closest(".fld.group_label.active")) clickingGrp = true;
  });
  document.addEventListener("mouseup", () => { clickingGrp = false; });

  chart.addEventListener("mouseover", (e) => {
    const gl = e.target.closest(".fld.group_label.active");
    if (gl && !gl._pinned) showGroupTable(gl);
  });
  chart.addEventListener("mouseout", (e) => {
    const gl = e.target.closest(".fld.group_label.active");
    if (gl && !gl._pinned && !clickingGrp && !gl.contains(e.relatedTarget)) hideTip();
  });
  chart.addEventListener("focusin", (e) => {
    const gl = e.target.closest(".fld.group_label.active");
    if (gl && !gl._pinned) showGroupTable(gl);
  });
  chart.addEventListener("focusout", (e) => {
    const gl = e.target.closest(".fld.group_label.active");
    if (gl && !tipEl.contains(e.relatedTarget)){ gl._pinned = false; hideTip(); }
  });
  chart.addEventListener("click", (e) => {
    const gl = e.target.closest(".fld.group_label.active");
    if (!gl) return;
    e.stopPropagation();
    if (pinnedEl && pinnedEl !== gl){
      pinnedEl._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); hideTip();
    }
    if (gl._pinned){
      gl._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); hideTip();
    } else {
      gl._pinned = true; pinnedEl = gl; showGroupTable(gl); tipEl.classList.add("pinned");
    }
  });

  // ── Click outside or Escape unpins ────────────────────────────────────
  document.addEventListener("click", (e) => {
    if (!pinnedEl) return;
    if (pinnedEl.contains(e.target) || tipEl.contains(e.target)) return;
    pinnedEl._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); hideTip();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape"){
      if (pinnedEl){ pinnedEl._pinned = false; pinnedEl = null; tipEl.classList.remove("pinned"); }
      hideTip();
    }
  });
  window.addEventListener("scroll", hideTip, { passive: true });
}

// Kiosk fit-to-screen: size the chart so the WHOLE thing fits the visible area
// (under the top bar) with no scrolling — constrained by width AND height,
// whichever is tighter — then centre it. Used on a TV/wall display via ?fit.
function fitToViewport(){
  if (!FIT) return;
  const bar = document.getElementById("bar");
  const credit = document.getElementById("credit");
  const availW = window.innerWidth;
  // Reserve room for the top bar AND the always-visible credit line so the
  // chart fits between them with no scrolling (overflow is hidden in fit mode).
  const barH = bar ? bar.offsetHeight : 0;
  const creditH = credit ? credit.offsetHeight : 0;
  const availH = window.innerHeight - barH - creditH;
  if (availW <= 0 || availH <= 0 || !canvasAR) return;
  // width if height-constrained vs. the full available width; take the smaller
  const widthIfHeightBound = availH * canvasAR;
  const w = Math.min(availW, widthIfHeightBound);
  chart.style.width = Math.floor(w) + "px";
}

(async function init(){
  if (FIT) document.body.classList.add("fit");
  await buildOverlay();
  wireTooltips();
  fitToViewport();
  hint.innerHTML = "Scores read live from Google Sheets, refreshing every " +
    (CFG.REFRESH_MS/1000) + "s. Edit the sheet to update — no redeploy needed.";
  await refresh();
  await refreshGroups();
  setInterval(refresh, CFG.REFRESH_MS);
  setInterval(refreshGroups, CFG.REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  // The chart scales with the viewport, so re-fit on resize/rotate (debounced):
  // recompute the kiosk size first, then re-fit each box's text.
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    hideTip();
    rt = setTimeout(() => {
      fitToViewport();
      for (const id in nodes) fitText(nodes[id]);
    }, 150);
  });
})();
</script>
</body>
</html>
