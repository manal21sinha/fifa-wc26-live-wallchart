<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>FIFA World Cup 2026 — Live Wall Chart</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b1d2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  #bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #07131c; color: #cfe6f2;
    font-size: 14px; border-bottom: 1px solid #16303f;
  }
  #bar strong { color: #fff; }
  #status { margin-left: auto; opacity: .9; white-space: nowrap; }
  #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ad07a; margin-right:6px; vertical-align: middle; }
  #status.stale .dot { background:#e0a93a; }
  #status.err .dot { background:#e0533a; }
  a.editlink { color:#6fd0ee; text-decoration:none; }

  #wrap { width: 100%; margin: 0 auto; }
  #chart { position: relative; width: 100%; container-type: size; }
  #chart img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

  .fld {
    position: absolute; display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap; line-height: 1;
    font-weight: 700; color: #111;
  }
  .fld.name { color: #0b1d2a; }

  /* ── Kaleidoscope fill for empty boxes ─────────────────────────────────
     Each empty field animates a multi-stop gradient while slowly rotating
     its hue. Per-box CSS vars (set in JS) randomise colours, angle, speed
     and phase so the chart shimmers with every box on its own rhythm.   */
  @keyframes kaleido {
    0%   { background-position:   0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position:   0% 50%; }
  }
  @keyframes kaleidoHue {
    from { filter: hue-rotate(0deg) saturate(1.05); }
    to   { filter: hue-rotate(360deg) saturate(1.05); }
  }
  .fld.empty {
    background-image: linear-gradient(
        var(--angle, 120deg),
        hsl(var(--h1, 200), 85%, 62%),
        hsl(var(--h2, 320), 85%, 62%),
        hsl(var(--h3, 50), 85%, 62%),
        hsl(var(--h1, 200), 85%, 62%));
    background-size: 320% 320%;
    border-radius: 3px;
    opacity: 0.9;
    animation:
      kaleido    var(--dur, 9s)  ease-in-out infinite,
      kaleidoHue var(--hue, 14s) linear      infinite;
    animation-delay: var(--delay, 0s);
    transition: opacity .6s ease;
  }
  /* When a value lands, the box leaves .empty: gradient fades, text shows. */
  .fld:not(.empty) { background-image: none; opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .fld.empty { animation: none; }   /* keep the colourful gradient, no motion */
  }

  #hint { color:#9fc2d4; font-size:13px; padding:10px 14px; }
  code { background:#13303f; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
  <div id="bar">
    <strong>World Cup 2026</strong> <span>Live Wall Chart</span>
    <span id="status"><span class="dot"></span><span id="statusText">loading…</span></span>
  </div>

  <div id="wrap"><div id="chart"><img id="bg" alt="World Cup 2026 wall chart" /></div></div>
  <p id="hint"></p>

<script src="config.js"></script>
<script>
const CFG = window.CHART_CONFIG;
const FIELDS_URL = "fields.json";
const chart = document.getElementById("chart");
const bg = document.getElementById("bg");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const hint = document.getElementById("hint");
bg.src = "chart.jpg";

const nodes = {};   // field id -> span element

function setStatus(state, text){ statusEl.className = state; statusText.textContent = text; }

// Build the gviz JSON endpoint — public, no API key, cache-buster friendly.
// We use JSON (not CSV) on purpose: gviz infers ONE type per column, so a
// Value column full of digits gets typed numeric and TEXT cells (team names)
// come back blank in CSV. JSON returns every cell's value (and a formatted
// string 'f') regardless of column type, so names and scores both arrive.
function sheetUrl(){
  const base = `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq`;
  const q = new URLSearchParams({ tqx: "out:json", sheet: CFG.SHEET_NAME,
                                  headers: "1", t: Date.now() });
  return `${base}?${q.toString()}`;
}

// gviz wraps JSON in a JS call:  /*O_o*/ google.visualization.Query.setResponse({...});
// Strip the wrapper and parse the payload.
function parseGviz(text){
  const a = text.indexOf("{");
  const b = text.lastIndexOf("}");
  if (a === -1 || b === -1) throw new Error("unexpected gviz response");
  return JSON.parse(text.slice(a, b + 1));
}

// Turn the gviz table into { fieldId: value }. Columns are matched by their
// header label (ID_COLUMN / VALUE_COLUMN). Cell value prefers the raw 'v';
// falls back to the formatted 'f'. Everything is coerced to a trimmed string.
function tableToValues(payload){
  const table = payload.table || {};
  const cols = table.cols || [];
  const rows = table.rows || [];
  const labelIdx = (name) => cols.findIndex(c => (c.label || "").trim() === name);
  let idIdx = labelIdx(CFG.ID_COLUMN);
  let valIdx = labelIdx(CFG.VALUE_COLUMN);
  // Fallback: if labels are missing, assume Description,Field ID,Value order.
  if (idIdx === -1) idIdx = 1;
  if (valIdx === -1) valIdx = 2;
  const cellStr = (cell) => {
    if (!cell) return "";
    const v = (cell.v !== null && cell.v !== undefined) ? cell.v : cell.f;
    return (v === null || v === undefined) ? "" : String(v).trim();
  };
  const out = {};
  for (const row of rows){
    const c = row.c || [];
    const id = cellStr(c[idIdx]);
    if (id) out[id] = cellStr(c[valIdx]);
  }
  return out;
}

async function buildOverlay(){
  const m = await (await fetch(FIELDS_URL, {cache:"no-store"})).json();
  chart.style.aspectRatio = `${m.canvas.width} / ${m.canvas.height}`;
  const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
  for (const f of m.fields){
    const el = document.createElement("div");
    el.className = "fld " + f.kind + " empty";   // start empty -> kaleidoscope
    el.style.left = f.left + "%"; el.style.top = f.top + "%";
    el.style.width = f.width + "%"; el.style.height = f.height + "%";
    const fs = (f.kind === "name") ? f.height * 0.62 : f.height * 0.72;
    const baseFs = `min(${fs}cqh, ${f.width * 0.9}cqw)`;
    el.dataset.basefs = baseFs;     // remembered so we can reset before refitting
    el.style.fontSize = baseFs;
    // Text lives in an inner span so we can measure its true width reliably
    // (a flex-centred container's scrollWidth is unreliable when text overflows
    // both sides). The span is what we fit; the box stays put.
    const span = document.createElement("span");
    span.style.whiteSpace = "nowrap";
    el.appendChild(span);
    el._txt = span;
    // Per-box random kaleidoscope: 3 spread hues, random angle/speed/phase.
    const base = rnd(0, 360);
    el.style.setProperty("--h1", base.toFixed(0));
    el.style.setProperty("--h2", ((base + rnd(80, 160)) % 360).toFixed(0));
    el.style.setProperty("--h3", ((base + rnd(180, 300)) % 360).toFixed(0));
    el.style.setProperty("--angle", rnd(0, 360).toFixed(0) + "deg");
    el.style.setProperty("--dur",  rnd(6, 13).toFixed(1) + "s");
    el.style.setProperty("--hue",  rnd(10, 22).toFixed(1) + "s");
    el.style.setProperty("--delay", (-rnd(0, 13)).toFixed(1) + "s"); // desync
    nodes[f.id] = el;
    chart.appendChild(el);
  }
}

// Shrink a field's text to fit its box when the natural (box-based) size is
// too wide — e.g. "SWITZERLAND" in a narrow name box. Reset to the base size
// first, then scale down by the overflow ratio (never up). Measures the inner
// span against the box's inner width.
function fitText(el){
  if (el.classList.contains("empty") || !el._txt || !el._txt.textContent) return;
  el.style.fontSize = el.dataset.basefs || el.style.fontSize;
  const avail = el.clientWidth * 0.92;     // leave a little side padding
  const need = el._txt.scrollWidth;
  if (need > avail && need > 0){
    const px = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(1, Math.floor(px * avail / need)) + "px";
  }
}

function applyValues(values){
  for (const id in nodes){
    const el = nodes[id];
    const v = (values[id] ?? "").toString();
    el._txt.textContent = v;
    // Empty -> shimmering kaleidoscope; filled -> clean value, no animation.
    el.classList.toggle("empty", v === "");
  }
  // Refit after the DOM updates so measurements are accurate.
  requestAnimationFrame(() => { for (const id in nodes) fitText(nodes[id]); });
}

async function refresh(){
  if (!CFG.SHEET_ID || CFG.SHEET_ID.startsWith("PASTE")){
    setStatus("err", "set SHEET_ID in config.js"); return;
  }
  try {
    const r = await fetch(sheetUrl(), {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const values = tableToValues(parseGviz(await r.text()));
    applyValues(values);
    // Prefer the sheet's own "_updated" cell; fall back to this poll time.
    const stamp = (values["_updated"] || "").trim();
    setStatus("", "updated " + (stamp ? formatStamp(stamp)
                                      : new Date().toLocaleTimeString()));
  } catch(e){
    setStatus("err", "couldn't reach sheet — retrying");
    console.error(e);
  }
}

// Format the sheet's timestamp. Accepts an ISO string or any value Date can
// parse; if it isn't a recognisable date, show the raw text as-is.
function formatStamp(s){
  const d = new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleString();
}

(async function init(){
  await buildOverlay();
  hint.innerHTML = "Scores read live from Google Sheets, refreshing every " +
    (CFG.REFRESH_MS/1000) + "s. Edit the sheet to update — no redeploy needed.";
  await refresh();
  setInterval(refresh, CFG.REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  // The chart scales with the viewport, so re-fit text on resize/rotate
  // (debounced) to keep long names snug at any size.
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { for (const id in nodes) fitText(nodes[id]); }, 150);
  });
})();
</script>
</body>
</html>
